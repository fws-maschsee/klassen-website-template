# Copier-Konfiguration.
#
# Alles unter template/ wird in das erzeugte Repository geschrieben; alles
# andere (CI-Harness, tests/, diese Datei) bleibt im Template.
_min_copier_version: "9.4.0"
_subdirectory: template
_envops:
  trim_blocks: true
  lstrip_blocks: true

# Die Lockfiles werden beim Erzeugen mitgeliefert, damit `npm ci` im Dockerfile
# sofort funktioniert. Bei `copier update` gewinnt aber die Lockfile der
# Instanz: dort haben Dependabot und lokale `npm install`-Läufe längst neuere
# Auflösungen eingetragen, und ein Rückschreiben der Template-Lockfile würde
# die Instanz auf den Stand des Templates zurückwerfen.
#
# Das Produktions-Overlay steht ebenfalls hier: `deploy/overlays/production/`
# trägt den gepinnten Image-Tag (den der Deploy-Workflow schreibt) und die
# SealedSecrets der Instanz. Beides ist Zustand der Klasse, kein Vorlagen-
# Inhalt — ein `copier update` würde sonst das laufende Deployment auf einen
# Platzhalter zurücksetzen.
_skip_if_exists:
  - package-lock.json
  - email-worker/package-lock.json
  - deploy/overlays/production/kustomization.yaml
  - deploy/overlays/production/sealed-oidc.yaml
  - deploy/overlays/production/sealed-mail.yaml

# ---------------------------------------------------------------------------
# Klasse
# ---------------------------------------------------------------------------

class_display_name:
  type: str
  help: >-
    Anzeigename der Klasse, so wie er auf der Website steht
    (z. B. "Klasse Musterfrau"). Der einzige Wert, der beim Wechsel der
    Klassenlehrkraft später angepasst wird.
  validator: >-
    {% if class_display_name | trim | length == 0 %}class_display_name darf nicht leer sein{% endif %}

class_slug:
  type: str
  help: >-
    Technischer Kurzname, klein und ohne Umlaute (z. B. "musterfrau"). Er
    steckt im Repository-Namen, im Hostnamen, im Kubernetes-Namespace, im
    Dateinamen der Datenbank und im Dateinamen des Kalenders. NACH dem Erzeugen
    ist er praktisch unveränderlich - siehe die Kommentare in
    src/site.config.ts.
  default: >-
    {{ class_display_name | lower | replace('klasse ', '') | replace('ä', 'ae') | replace('ö', 'oe') | replace('ü', 'ue') | replace('ß', 'ss') | replace(' ', '-') | trim }}
  validator: >-
    {% if not class_slug | regex_search('^[a-z0-9][a-z0-9-]*$') %}class_slug darf nur a-z, 0-9 und - enthalten und muss mit a-z oder 0-9 beginnen{% endif %}

school_name:
  type: str
  help: Name der Schule, ausgeschrieben. Erscheint auf der Startseite.
  default: Freie Waldorfschule Musterstadt

first_post_date:
  type: str
  help: >-
    Datum des ersten Berichts im Format JJJJ-MM-TT. Trage das heutige Datum
    ein; es wird zum Dateinamen und zum Datum des Willkommens-Beitrags.
  default: "2026-01-01"
  validator: >-
    {% if not first_post_date | regex_search('^[0-9]{4}-[0-9]{2}-[0-9]{2}$') %}first_post_date muss das Format JJJJ-MM-TT haben{% endif %}

# ---------------------------------------------------------------------------
# Repository und Domain
# ---------------------------------------------------------------------------

github_org:
  type: str
  help: >-
    GitHub-Organisation, der das erzeugte Repository gehört. Sie ist zugleich
    der Vorgabewert für gitops_repo.
  default: meine-schule

repo_name:
  type: str
  help: >-
    Name des erzeugten Repositories innerhalb der Organisation. Derselbe Wert
    ist zugleich Kubernetes-Namespace, Image-Name, Instanz-Identität
    (MCP_INSTANCE_NAME), Dateiname der Datenbank und Klassen-Label der
    Mailinglisten. Er wird beim ersten Start in die Datenbank geschrieben und
    danach bei jedem Start dagegen geprüft - eine spätere Änderung fährt den
    Server nicht mehr hoch.
  default: klasse-{{ class_slug }}
  validator: >-
    {% if not repo_name | regex_search('^[a-z0-9][a-z0-9-]*$') %}repo_name darf nur a-z, 0-9 und - enthalten (er ist zugleich Namespace und DNS-Label){% endif %}

base_domain:
  type: str
  help: >-
    Basis-Domain der Schule. Auf sie muss ein Wildcard-DNS-Eintrag
    *.<base_domain> zeigen, sonst bekommt die Klassenseite kein Zertifikat.
    Die Vorgabe ist ein Platzhalter (RFC 2606) und MUSS ersetzt werden - diese
    Vorlage ist oeffentlich und traegt deshalb keine echte Schuldomain.
  default: schule.example
  validator: >-
    {% if '.' not in base_domain or ' ' in base_domain or '://' in base_domain %}base_domain muss ein reiner DNS-Name wie beispiel.de sein{% endif %}

site_domain:
  type: str
  help: >-
    Vollständiger Hostname der Website. Der Vorgabewert ist der Normalfall.
    Abweichen nur, wenn die Klasse eine eigene, bereits registrierte Domain
    mitbringt - dieser Wert ist nach dem Livegang faktisch festgenagelt (DNS,
    Zertifikat, Kalender-Abos, Lesezeichen der Eltern, redirect_uri am
    OIDC-Client).
  default: "{{ repo_name }}.{{ base_domain }}"
  validator: >-
    {% if '.' not in site_domain or ' ' in site_domain or '://' in site_domain %}site_domain muss ein reiner DNS-Name sein{% endif %}

contact_email:
  type: str
  help: >-
    E-Mail-Adresse für technische Rückfragen. Steht in der README und auf der
    Seite, die Eltern sehen, die angemeldet, aber noch nicht freigeschaltet
    sind. Die Vorgabe ist ein Platzhalter und MUSS ersetzt werden.
  default: technik@{{ base_domain }}
  validator: >-
    {% if '@' not in contact_email %}contact_email muss eine E-Mail-Adresse sein{% endif %}

# ---------------------------------------------------------------------------
# Anmeldung (ZITADEL)
# ---------------------------------------------------------------------------
# Die Anmeldung läuft über OpenID Connect gegen das zentrale ZITADEL der
# Schule. Rollen, Grants und der OIDC-Client selbst sind Identity-Content: Sie
# werden über die ZITADEL-API gepflegt und stehen in KEINEM Repository. Die
# Vorlage fragt deshalb nur nach den Bezeichnern, die die App zur Laufzeit
# braucht.

oidc_issuer:
  type: str
  help: >-
    Aussteller-URL des zentralen ZITADEL, inklusive https://. Muss zeichengenau
    dem `issuer` in dessen Discovery-Dokument entsprechen.
  default: https://id.{{ base_domain }}
  validator: >-
    {% if not oidc_issuer.startswith('https://') %}oidc_issuer muss mit https:// beginnen{% endif %}

zitadel_org_id:
  type: str
  help: >-
    Numerische ID der ZITADEL-Organisation der Schule. Wird gebraucht, um die
    Rollen-Grants der Eltern zu lesen (Adressbuch-Abgleich). Steht im
    ZITADEL-Dashboard; nicht geheim. Leer lassen, wenn das Projekt erst noch
    angelegt wird - dann später in deploy/overlays/production/deployment.yaml
    eintragen.
  default: ""

zitadel_project_id:
  type: str
  help: >-
    Numerische ID des ZITADEL-PROJEKTS dieser Klasse. Jede Klasse hat ihr
    eigenes Projekt; genau daraus entsteht die Trennung der Klassen
    voneinander, denn ein Token trägt nur die Rollen des Projekts, zu dem der
    OIDC-Client gehört. Leer lassen, wenn das Projekt erst noch angelegt wird.
  default: ""

# ---------------------------------------------------------------------------
# Mailinglisten und Versand
# ---------------------------------------------------------------------------

mail_from:
  type: str
  help: >-
    Verifizierte Absenderadresse für alles, was diese Instanz verschickt. Muss
    in Amazon SES verifiziert sein, sonst weist SES die Mail ab.
  default: noreply@{{ base_domain }}
  validator: >-
    {% if '@' not in mail_from %}mail_from muss eine E-Mail-Adresse sein{% endif %}

list_base_domain:
  type: str
  help: >-
    Listen-Domain OHNE Klassen-Label. Auf *.<list_base_domain> muss ein
    Wildcard-MX zeigen; die Adressen dieser Klasse lauten dann
    <liste>@<repo_name>.<list_base_domain>.
  default: lists.{{ base_domain }}
  validator: >-
    {% if '.' not in list_base_domain or ' ' in list_base_domain %}list_base_domain muss ein reiner DNS-Name sein{% endif %}

worker_name:
  type: str
  help: >-
    Name des Cloudflare-Workers, der die Listenmail dieser Klasse annimmt. Er
    taucht so im Cloudflare-Dashboard auf. Ein Worker je Klasse.
  default: "{{ repo_name }}"
  validator: >-
    {% if not worker_name | regex_search('^[a-z0-9][a-z0-9-]*$') %}worker_name darf nur a-z, 0-9 und - enthalten{% endif %}

# ---------------------------------------------------------------------------
# Kalender
# ---------------------------------------------------------------------------

calendar_filename:
  type: str
  help: >-
    Dateiname des Klassenkalenders unter public/public/. Die Eltern
    abonnieren ihn als webcal://<site_domain>/public/<dieser Name>. Der Name
    darf danach NIE wieder geändert werden - siehe src/site.config.ts.
  default: "{{ class_slug }}.ics"
  validator: >-
    {% if not calendar_filename | regex_search('^[a-z0-9._-]+\.ics$') %}calendar_filename muss auf .ics enden und darf nur a-z, 0-9, . _ - enthalten{% endif %}

# ---------------------------------------------------------------------------
# Betrieb
# ---------------------------------------------------------------------------

gitops_repo:
  type: str
  help: >-
    GitHub-Repository, in dem die Argo-CD-`Application` dieser Klasse liegt.
    Die Kubernetes-Manifeste selbst bleiben hier, unter
    deploy/overlays/production/ - dorthin schreibt der Deploy-Workflow den
    gepinnten Image-Tag.
  default: "{{ github_org }}/server-config"

target_arch:
  type: str
  help: >-
    Architektur des Cluster-Knotens. Das Image wird auf einem nativen Runner
    dieser Architektur gebaut, nie unter QEMU.
  choices:
    - amd64
    - arm64
  default: amd64

plausible_script_url:
  type: str
  help: >-
    URL des Plausible-Skripts für die Besucherzählung. Leer lassen (Vorgabe),
    um keine Statistik einzubinden - dann laedt die Seite von keinem fremden
    Host. Wer eine Zaehlung will, traegt hier die URL der EIGENEN
    Plausible-Instanz ein; ein fremder Host ist eine Abhaengigkeit, die
    irgendwann jemand abschaltet.
  default: ""
