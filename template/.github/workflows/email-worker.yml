name: Email Worker

on:
  push:
    branches: [ main ]
    paths:
      - 'email-worker/**'
      - '.github/workflows/email-worker.yml'
  pull_request:
    paths:
      - 'email-worker/**'
      - '.github/workflows/email-worker.yml'

# Nur Prüfung: deployt wird ausschließlich über Cloudflare Workers Builds aus main, nie per wrangler.
jobs:
  test:
    name: Typecheck und Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-worker

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: email-worker/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
