name: Autorisierung

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Container-Images holen
        run: |
          docker pull postgres:17-alpine
          docker pull ghcr.io/zitadel/zitadel:v4.13.1
          docker pull ghcr.io/zitadel/zitadel-login:v4.13.1

      - name: Stack hochfahren
        run: npm run authz:up

      - name: Autorisierungs-Tests
        run: npm run test:e2e:authz

      - name: Logs bei Fehlschlag
        if: failure()
        run: npm run authz:logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-authz
          path: playwright-report/
          retention-days: 30

      - name: Stack abraeumen
        if: always()
        run: npm run authz:down
