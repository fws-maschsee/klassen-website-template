name: Biome

on:
  pull_request:
    branches: [ main ]
  # Auf main ruft main.yml diesen Workflow auf.
  workflow_call:

jobs:
  biome:
    name: Run Biome
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Biome
      uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2

    - name: Run Biome
      run: biome ci
