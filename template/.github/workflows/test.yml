name: Tests

on:
  pull_request:
    branches: [main]
  # Auf main ruft main.yml diesen Workflow auf.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Astro 7 verlangt Node >= 22.23.4; ohne check-latest nimmt setup-node das ältere Node aus dem Runner-Image.
          node-version: '22'
          check-latest: true
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit-Tests
        run: npm test
